<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desenvolvendo Habilidades - CASIA 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#fff4e6,#ffe7c2);
    min-height:100vh;
    color:#6b4a21;
}

header{
    background:linear-gradient(135deg,#ff9f43,#ffcc70);
    padding:22px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:18px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 6px 25px rgba(0,0,0,.18);
}

header img{
    height:70px;
}

header h1{
    color:#7a3e00;
    text-align:center;
}

.container{
    max-width:1200px;
    margin:30px auto;
    padding:0 20px;
}

.section{
    background:rgba(255,255,255,.45);
    border:1px solid rgba(255,255,255,.6);
    border-radius:30px;
    padding:30px;
    box-shadow:0 15px 40px rgba(0,0,0,.12);
}

h2{
    text-align:center;
    color:#7a3e00;
    margin-bottom:10px;
}

p{
    text-align:center;
    margin-bottom:20px;
}

.game-container{
    width:90%;
    max-width:900px;
    height:600px;
    margin:0 auto;
    overflow:hidden;
    border-radius:20px;
    background:#fff;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.game-container iframe{
    width:100%;
    height:100%;
    border:none;
}

footer{
    margin-top:30px;
    text-align:center;
    padding:25px;
    background:linear-gradient(135deg,#ffcc70,#ffd992);
    color:#7a3e00;
}

@media(max-width:900px){

    header{
        flex-direction:column;
    }

    .game-container{
        width:100%;
        height:500px;
    }
}
</style>
</head>

<body>

<header>
    <img src="https://i.imgur.com/OZiRh07.png" alt="Logo CASIA">
    <h1>Desenvolvendo Habilidades</h1>
</header>

<div class="container">

    <div class="section">

        <h2>Jogo Educativo</h2>

        <p>
            Desenvolva sua atenção, concentração e raciocínio lógico enquanto se diverte.
        </p>

        <div class="game-container">
            <iframe
                src="https://html5.gamedistribution.com/6fc3bef749fd4ce2b5959444febe9ee0/?gd_sdk_referrer_url=https://markvin772-ops.github.io/casia/"
                width="800"
                height="600"
                scrolling="none"
                frameborder="0"
                allowfullscreen>
            </iframe>
        </div>

    </div>

</div>

<footer>
    © CASIA 2026 - Desenvolvendo Habilidades
</footer>

</body>
</html>
